name: paranormal_lens
description: "PL - Cross-platform AR horror & sacred symbols detector"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Device & Sensors
  camera: ^0.10.5+9
  sensors_plus: ^4.0.2
  geolocator: ^10.1.0

  # State Management & Architecture
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

  # Custom Hardware-Accelerated Fragment Shaders (Impeller/Skia)
  shaders:
    - shaders/green_phosphor_grain.frag
    - shaders/thermal_palette.frag
    - shaders/crt_scanline_noise.frag
    - shaders/procedural_shadow.frag
