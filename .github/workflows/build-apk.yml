name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Prepare Named PL APK Files
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/PL-release.apk

      - name: Upload PL APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-apk
          path: build/dist/PL.apk

      - name: Upload PL Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-release-apk
          path: build/dist/PL-release.apk

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "PL v1.0.1 (Stable APK)"
          body: |
            ### 👻 PL v1.0.1 - Stable Build
            - **Fixed Startup Crash**: Fixed Android package namespace mismatch with MainActivity.
            - **Renamed to PL**: App and output APK file named `PL.apk`.
            - **Hardware & Emulator Support**: Added simulated viewfinder fallback when camera is unavailable.
            - **Lightweight APK**: Removed unneeded native Google Play Services binaries, reducing download size.
            
            **Direct Download:**
            - [PL.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.1/PL.apk)
            - [PL-release.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.1/PL-release.apk)
          files: |
            build/dist/PL.apk
            build/dist/PL-debug.apk
            build/dist/PL-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
