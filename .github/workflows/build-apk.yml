name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ParanormalLens APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ParanormalLens-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ParanormalLens-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ParanormalLens v1.0.0 APK"
          body: |
            ### 👻 ParanormalLens v1.0.0 - Test Build
            - Hardware GLSL post-processing camera filters (Night Vision, Thermal Ironbow, EVP CRT static)
            - Procedural shadow entities (Slender, Lurker, Window Inverted Raven, Cemetery Watcher)
            - 5 Hz Sacred Relic Computer Vision detection & banishment
            - Stealth jumpscare prank mode
            - Procedural soundscapes (ambient drone, geiger clicks, holy bells)
            
            **Installation:** Download `app-debug.apk` directly to your Android smartphone and open to install.
          files: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
