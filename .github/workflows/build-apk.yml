name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Prepare Named PL APK Files
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/PL-release.apk

      - name: Upload PL APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-apk
          path: build/dist/PL.apk

      - name: Upload PL Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-release-apk
          path: build/dist/PL-release.apk

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "PL v1.0.3 - AR Gyro Spatial Anchoring, Sacred Exorcism Ritual, Haunt Drone & 3s Bestiary Scan"
          body: |
            ### 👻 PL v1.0.3 - AR Gyro Spatial Anchoring & Sacred Exorcism Update
            - **Spatial AR Gyroscope Anchoring**: Phantoms and entities now remain locked in 3D world space. Turning the phone shifts the phantom out of view and turning back brings it back into frame.
            - **Authentic Sacred Exorcism Ritual**: Tapping "Освятить" triggers a radiant Orthodox Cross (☦), divine rays, burning halo, and Old Church Slavonic exorcist prayer chants («ДА ВОСКРЕСНЕТЪ БОГЪ...», «СВЯТЫЙ БОЖЕ...»), church bell chimes, and holy ember disintegration.
            - **New Phantom Archetype (Haunt Drone)**: "Темный Летун из темноты" (Archetype 6.0) glides out of pitch darkness with glowing yellow/white demonic eyes, wide outstretched wings, and approach depth scaling.
            - **3-Second Lock-on Bestiary Scanner**: Aiming the crosshair at a ghost for 3 continuous seconds initiates AR circular progress scanning and unlocks/researches the entity in the Bestiary with a discovery chime.
            - **Thermal Dynamic Temperature & Anomaly Field Warning**: Replaced static 36.6°C with dynamic sensor readings; detects ghosts with an icy drop (-2.8°C), rapid Geiger clicks, and `⚠️ [АНОМАЛЬНОЕ ПОЛЕ ОБНАРУЖЕНО!]`.
            - **Filter Button Sync & HUD Positioning**: Fixed bottom bar active tab highlighting in VHS/Thermal modes and shifted HUD overlays away from action buttons (zero-overlap).
            
            **Direct Download:**
            - [PL.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.3/PL.apk)
            - [PL-release.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.3/PL-release.apk)
          files: |
            build/dist/PL.apk
            build/dist/PL-debug.apk
            build/dist/PL-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
