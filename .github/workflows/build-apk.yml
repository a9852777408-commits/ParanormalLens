name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Prepare Named PL APK Files
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/PL-release.apk

      - name: Upload PL APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-apk
          path: build/dist/PL.apk

      - name: Upload PL Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-release-apk
          path: build/dist/PL-release.apk

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: "PL v1.0.9 - High-Fidelity Living AR Apparitions & Studio Detailed Entities"
          body: |
            ### 👻 PL v1.0.9 - High-Fidelity Living AR Apparitions & Detailed Entities
            - **High-Fidelity Detail for All 5 Major Entities**:
              - 🦇 **Haunt Drone (Тёмный Летун)**: Studio-isolated winged gargoyle demon with massive arched wings, muscular torso, demonic horns, and dual burning yellow-hot eye flares that flicker with living fire.
              - 🕯️ **Ghost of Emperor Paul I (Призрак Павла I)**: Authentic imperial phantom in an 18th-century tricorn hat with cockade, military officer uniform with epaulets, sash, and star cross order, holding a brass candlestick with a warm flickering lit candle.
              - 🦅 **Inverted Raven (Инвертированный Ворон)**: Photorealistic upside-down perched raven with detailed black plumage, talons, and a piercing amber glowing eye glint.
              - 👤 **White Cemetery Watcher (Белый Страж Кладбища)**: Translucent, ethereal milky-white humanoid female silhouette surrounded by a soft volumetric celestial aura.
              - 💀 **Flying Morok (Летающий Морок)**: Detailed floating human skull with distinct eye sockets and jaw teeth, with a billowing vortex of black ectoplasm smoke.
            - **Living AR Motion & Physics Engine**:
              - Fluid organic levitation ($\sin(t)$ hover), horizontal drift, breathing scale pulsation, and gentle spectral tilt.
              - Multi-layered glowing spectral auras (amber, cyan, fiery orange, celestial white, jade ectoplasm).
              - Living specular flares at eye levels and the candle flame with organic light noise.
            - **Zero Box Borders & Seamless AR Blending**:
              - All concept sprites processed with precision alpha feathering; zero rectangular photo frames or HUD artifacts.
              - Adapts dynamically to active camera filter (Night Vision phosphor luminescence, Thermal false-color heat, VHS tape artifacts, Normal).
            - **True 3D AR Spatial Anchoring & Cross Contour Illumination**:
              - Firmly anchored to 3D room coordinates.
              - Physical golden neon contour illumination on real crosses with zero false positives.
            
            **Direct Download:**
            - [PL.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.9/PL.apk)
            - [PL-release.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.9/PL-release.apk)
          files: |
            build/dist/PL.apk
            build/dist/PL-debug.apk
            build/dist/PL-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
