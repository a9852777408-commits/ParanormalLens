name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Prepare Named PL APK Files
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/PL-release.apk

      - name: Upload PL APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-apk
          path: build/dist/PL.apk

      - name: Upload PL Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-release-apk
          path: build/dist/PL-release.apk

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "PL v1.0.7 - Cinematic Concept Entities, High-Res Bestiary & 3D AR Floating Apparitions"
          body: |
            ### 👻 PL v1.0.7 - Cinematic Concept Visuals & 3D AR Overhaul
            - **Cinematic Concept Artwork Integration**: Incorporated the authentic high-resolution concept designs for all 5 major entities:
              - 🦇 **Haunt Drone (Тёмный Летун)**: Winged demon emerging from volumetric black smoke with arched bat wings, curved horns, and piercing yellow-hot eyes at head level.
              - 🕯️ **Ghost of Paul I (Призрак Павла I)**: Luminous cyan holographic contour in an 18th-century tricorn hat with cockade, imperial uniform with epaulets and star order, holding a glowing candle with radiating light.
              - 🦅 **Inverted Raven (Инвертированный Ворон)**: Photorealistic raven perched upside-down with downward-pointing sharp beak, sleek wing feathers, upright tail feathers, and a fiery amber glowing eye.
              - 👤 **White Graveyard Guardian (Белый Страж Кладбища)**: Translucent, graceful milky-white humanoid silhouette with soft volumetric glowing aura walking among misty graveyard tombstones (clearly defined human figure).
              - 💀 **Flying Morok (Летающий Морок)**: Anatomically distinct floating human skull with sunken dark eye sockets and teeth, trailing a massive billowing vortex of black ectoplasm smoke.
            - **3D AR Floating Apparitions in Camera Viewfinder**: Entities materialize directly in the real room in 3D AR space, with floating levitation, dynamic scaling, spectral aura, and holy golden dissolution upon exorcism.
            - **Overhauled Bestiary Dossiers**: Authentic high-res concept artwork displayed in cards and inspection sheets, with shrouded dark silhouettes and mystery locks for uncaptured entities.
            - **Ultra-Sensitive Cross Vision AI & Bell Chime**: Instant computer vision detection of crosses across all sizes, accompanied by haptic feedback and cathedral bell chime.
            
            **Direct Download:**
            - [PL.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.7/PL.apk)
            - [PL-release.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.7/PL-release.apk)
          files: |
            build/dist/PL.apk
            build/dist/PL-debug.apk
            build/dist/PL-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
