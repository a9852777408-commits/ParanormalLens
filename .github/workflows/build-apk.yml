name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Prepare Named PL APK Files
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/PL-release.apk

      - name: Upload PL APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-apk
          path: build/dist/PL.apk

      - name: Upload PL Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-release-apk
          path: build/dist/PL-release.apk

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "PL v1.0.5 - Real Cross Vision AI, 3D AR Motion Fusion, Custom Ghost Art & Zero-Overlap UI"
          body: |
            ### 👻 PL v1.0.5 - Major Vision, AR Motion & Bestiary Overhaul
            - **Real Camera Cross Recognition**: Multi-scale computer vision detector recognizing Orthodox & Latin crosses directly in the live video stream (monitors, icons, walls, neck crosses), triggering radiant godrays and phantom incineration.
            - **True 3D Spatial AR Motion Fusion**: Integrated dual Gyroscope + Accelerometer motion tracking. Phantoms now stay firmly anchored in physical 3D room coordinates on ALL devices (including Redmi/Xiaomi without hardware gyro).
            - **Off-Screen Anomaly Radar Pointers**: When the phantom leaves the camera frame, directional HUD indicators (`◀ АНОМАЛИЯ СЛЕВА` / `АНОМАЛИЯ СПРАВА ▶`) guide the player where to look.
            - **Infinite Scanning Fixed**: Phantoms are scanned once per encounter (`entity.isScanned = true`); scanner no longer loops repeatedly on the same entity.
            - **Authentic Ghost Art in Bestiary**: Empty initial diary (zero unearned ghosts like Paul I); each entity now has custom atmospheric spectral illustrations in cards and dossiers instead of generic icons.
            - **Zero-Overlap UI**: Fixed top bar 71px right overflow, elevated floating notifications above the toolbar, and cleanly separated OSD layers.
            
            **Direct Download:**
            - [PL.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.5/PL.apk)
            - [PL-release.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.5/PL-release.apk)
          files: |
            build/dist/PL.apk
            build/dist/PL-debug.apk
            build/dist/PL-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
