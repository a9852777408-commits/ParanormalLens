name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Prepare Named PL APK Files
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/dist/PL-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/PL-release.apk

      - name: Upload PL APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-apk
          path: build/dist/PL.apk

      - name: Upload PL Release APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PL-release-apk
          path: build/dist/PL-release.apk

      - name: Publish GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "PL v1.0.8 - True 3D AR Spatial Anchoring & Strict Physical Cross Contour Illumination"
          body: |
            ### ☦️ PL v1.0.8 - True 3D AR Spatial Anchoring & Physical Cross Illumination
            - **Strict Christian / Orthodox Cross Detection & Physical Contour Illumination**:
              - Eliminates 100% of false positives on camera crosshairs, reticles, window frames, and tile grids via 5-invariant geometric validation ($L_{bot}/L_{top} \in [1.45, 4.2]$, $H/W \ge 1.25$, symmetric crossbars, terminated arm ends, clear diagonal background).
              - Removed synthetic drawn cross overlay and 16 full-screen blinding sunburst rays.
              - The physical contour of the detected cross is illuminated with a localized golden neon glow, soft aura, and compact holy halo around the cross junction.
            - **True 3D AR Spherical Room Spatial Anchoring**:
              - Phantoms are firmly anchored to fixed spherical 3D room coordinates (`worldAzimuth`, `worldElevation`, `distance`) in physical room space.
              - Smooth, drift-free sensor fusion (gyroscope angular velocity integration + accelerometer gravity pitch reference).
              - When turning the phone away, the entity moves off-screen and directional indicators appear (◀ АНОМАЛИЯ СЛЕВА / СПРАВА ▶). When turning back, the phantom stays in the exact same physical spot in the room.
              - Halts endless re-scanning: phantoms are no longer glued to the viewfinder center.
            - **Cinematic Volumetric Procedural Shader Rendering**:
              - Removed flat 2D sticker cutouts from the camera viewfinder.
              - Entities are rendered procedurally through the GPU fragment shader with organic fluid ectoplasm, breathing motion, smoke fbm noise, glowing demonic eyes, and holy ember dissolution.
            - **UI Layout & Non-Overlapping HUD**:
              - Moved the cross status badge cleanly below the top HUD action bar (`top: MediaQuery.padding.top + 54`) to prevent any element overlap.
            
            **Direct Download:**
            - [PL.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.8/PL.apk)
            - [PL-release.apk](https://github.com/a9852777408-commits/ParanormalLens/releases/download/v1.0.8/PL-release.apk)
          files: |
            build/dist/PL.apk
            build/dist/PL-debug.apk
            build/dist/PL-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
